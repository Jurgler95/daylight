# Baut die sideloadbare APK, prüft ihr Manifest und stellt sie als GitHub-Release bereit, danach geht
# das App Bundle in den Play Store (play.yml). Angestoßen
# vom Deploy-Skill (.claude/skills/deploy) per `gh workflow run release.yml --ref main -f
# version=1.0.11`, nachdem Version, Updatehistorie und Commit auf main liegen. Übernommen aus der
# Zyklus-App, ergänzt um die Manifestprüfung.
#
# Gestartet wird auf main statt über einen gepushten Tag, weil GitHub Caches nach Ref trennt: ein
# Lauf für einen neuen Tag sähe weder den npm- noch den Gradle-Cache. Den Tag `vX.Y.Z` setzt erst
# die Veröffentlichung am Ende, es gibt also nie einen Tag ohne Release.
name: Release
run-name: Daylight ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version wie in app.json, ohne v
        required: true

permissions:
  contents: write

concurrency:
  group: release

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ inputs.version }}
      TAG: v${{ inputs.version }}
    steps:
      # Alle Tags, damit das Release-Notes-Skript den versionCode der Vorversion findet
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Noch nicht veröffentlicht
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG ist schon veröffentlicht, bitte eine neue Version heben"
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # JDK 17, nicht neuer, sonst scheitert Gradle
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Schreibt den Cache nur auf dem Default-Branch, deshalb der Start auf main. Auf einen Commit
      # festgenagelt (v4.4.3, worauf v4 zeigte), weil die Action vor den Schritten mit dem
      # Signaturschlüssel läuft und ein verschobener Tag sonst fremden Code mitbrächte.
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Versionen und Updatehistorie abgleichen
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON .github/scripts/release-notes.mjs "$VERSION" > release-notes.md

      - run: npm ci

      - name: Typecheck und Tests
        run: npm run typecheck && npm test

      # Das Plugin plugins/withReleaseSigning.js trägt die Release-Signatur ein, sie greift nur mit
      # DAYLIGHT_KEYSTORE (nächster Schritt).
      - name: Android-Projekt erzeugen
        run: npx expo prebuild --platform android --clean --no-install

      # Build-Cache an, und mehr Speicher für den Gradle-Daemon, als das Template vorsieht. Die
      # Datei im Gradle-Home hat Vorrang vor android/gradle.properties.
      - name: Gradle einstellen
        run: mkdir -p ~/.gradle && printf 'org.gradle.caching=true\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g\n' >> ~/.gradle/gradle.properties

      # Der Keystore liegt Base64-kodiert im Secret und nur für die beiden Builds auf der Platte.
      # Fehlt ein Secret, bricht der Lauf ab, statt still mit dem Debug-Schlüssel zu signieren. Ins
      # Job-Environment kommen nur Pfad und Alias, das Passwort bekommen allein die Build-Schritte.
      - name: Signaturschlüssel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.DAYLIGHT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DAYLIGHT_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Secrets DAYLIGHT_KEYSTORE_BASE64 und DAYLIGHT_KEYSTORE_PASSWORD fehlen"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/daylight-release.jks"
          {
            echo "DAYLIGHT_KEYSTORE=$RUNNER_TEMP/daylight-release.jks"
            echo "DAYLIGHT_KEY_ALIAS=daylight"
          } >> "$GITHUB_ENV"

      # arm64 reicht für jedes aktuelle Gerät und spart mehr als die Hälfte der Größe
      - name: APK bauen
        working-directory: android
        env:
          DAYLIGHT_KEYSTORE_PASSWORD: ${{ secrets.DAYLIGHT_KEYSTORE_PASSWORD }}
          DAYLIGHT_KEY_PASSWORD: ${{ secrets.DAYLIGHT_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a

      # Das App Bundle für den Play Store. Anders als die APK mit 32- und 64-Bit-ARM, weil Play
      # daraus je Gerät eine passende APK schneidet und sonst ältere Geräte ausschlösse.
      - name: App Bundle bauen
        working-directory: android
        env:
          DAYLIGHT_KEYSTORE_PASSWORD: ${{ secrets.DAYLIGHT_KEYSTORE_PASSWORD }}
          DAYLIGHT_KEY_PASSWORD: ${{ secrets.DAYLIGHT_KEYSTORE_PASSWORD }}
        run: ./gradlew bundleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      # Danach braucht nichts mehr den Schlüssel. Läuft auch nach einem gescheiterten Build, und der
      # Gradle-Daemon, der das Passwort aus den Build-Schritten noch kennt, wird mit beendet.
      - name: Signaturschlüssel löschen
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/daylight-release.jks"
          if [ -x android/gradlew ]; then (cd android && ./gradlew --stop) || true; fi

      # Der Fingerabdruck ist öffentlich und steht auch im README. Weicht er ab, wurde mit einem
      # anderen Schlüssel signiert, und das Update ließe sich nicht über die installierte App spielen.
      - name: Signatur prüfen
        env:
          EXPECTED: 9D:5E:FF:54:19:70:F6:09:85:7F:B6:F8:43:1C:E8:62:74:B4:6E:FB:2E:1B:56:A5:9B:63:CC:87:04:1F:C9:8A
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          ACTUAL=$("$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk \
            | sed -n 's/.*certificate SHA-256 digest: //p' | sort -u | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          echo "Signatur: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Die APK ist nicht mit dem Daylight-Schlüssel signiert"
            exit 1
          fi
          BUNDLE=$(keytool -printcert -jarfile android/app/build/outputs/bundle/release/app-release.aab \
            | sed -n 's/^[[:space:]]*SHA256: //p' | sort -u)
          echo "Signatur Bundle: $BUNDLE"
          if [ "$BUNDLE" != "$EXPECTED" ]; then
            echo "::error::Das App Bundle ist nicht mit dem Daylight-Schlüssel signiert"
            exit 1
          fi

      # Kein INTERNET, keine Cloud-Sicherung, Health Connect nur lesend, in der APK wie im App Bundle.
      # Schlägt das fehl, wird nichts veröffentlicht. aapt2 liest kein Bundle, deshalb macht
      # bundletool daraus eine universelle APK (unsigniert, nur zum Prüfen) mit Manifest und Code
      # des Bundles. bundletool kommt als festgelegte Version mit Prüfsumme von GitHub.
      - name: Manifest prüfen
        env:
          BUNDLETOOL_VERSION: 1.18.3
          BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "daylight-$VERSION.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "daylight-$VERSION.aab"
          # Die Zuordnung der von R8 gekürzten Namen, aus dem Bundle-Build (der zuletzt lief). Play
          # braucht sie für lesbare Absturzberichte, der Code ist ohnehin offen.
          cp android/app/build/outputs/mapping/release/mapping.txt "daylight-$VERSION-mapping.txt"
          echo "APK:"
          node .github/scripts/check-manifest.mjs "daylight-$VERSION.apk" "daylight-$VERSION-mapping.txt"
          BUNDLETOOL="$RUNNER_TEMP/bundletool.jar"
          curl -fsSL -o "$BUNDLETOOL" "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar"
          echo "$BUNDLETOOL_SHA256  $BUNDLETOOL" | sha256sum -c -
          java -jar "$BUNDLETOOL" build-apks --mode=universal --bundle "daylight-$VERSION.aab" --output "$RUNNER_TEMP/bundle.apks"
          unzip -o -q "$RUNNER_TEMP/bundle.apks" universal.apk -d "$RUNNER_TEMP/bundle"
          echo "App Bundle:"
          node .github/scripts/check-manifest.mjs "$RUNNER_TEMP/bundle/universal.apk" "daylight-$VERSION-mapping.txt"

      # Erst als Entwurf anlegen oder einen Entwurf aus einem abgebrochenen Lauf weiterverwenden,
      # dann APK und App Bundle hochladen und zuletzt veröffentlichen. So ist ein Release erst
      # sichtbar, wenn beide dranhängen, und ein Rerun landet im selben Zustand.
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Daylight $VERSION" --notes-file release-notes.md --target "$GITHUB_SHA"
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" \
              --title "Daylight $VERSION" --notes-file release-notes.md
          fi
          gh release upload "$TAG" "daylight-$VERSION.apk" "daylight-$VERSION.aab" "daylight-$VERSION-mapping.txt" --clobber
          gh release edit "$TAG" --draft=false

  # Danach geht das App Bundle in den Play Store, siehe play.yml. Ein eigener Workflow, damit sich ein
  # gescheiterter Upload wiederholen lässt, ohne neu zu bauen oder das Release anzufassen.
  play:
    needs: apk
    uses: ./.github/workflows/play.yml
    with:
      version: ${{ inputs.version }}
    # Nur der Play-Zugang, nicht auch der Signaturschlüssel
    secrets:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
